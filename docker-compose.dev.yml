# Local development services. Production uses docker-compose.yml (Phase 7).
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    # Same major version as the deployed Neon database, so `npm run db:pull` can dump it.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kstirana
      POSTGRES_PASSWORD: kstirana_dev
      POSTGRES_DB: kstirana
      TZ: Europe/Tirane
    ports:
      # Host port 5433 avoids clashing with any Postgres already installed on the machine.
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kstirana -d kstirana"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata18:
